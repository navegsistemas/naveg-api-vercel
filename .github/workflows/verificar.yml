# **Os checks de cada pull request** — o que tem de estar verde antes de algo entrar na `main`.
#
# A `main` vai sozinha para o ar a cada merge (plano de ambientes do `naveg-front`, §4), então a conferência
# acontece aqui. Os dois jobs viram checks obrigatórios no ruleset da `main` e da `producao`.
#
# O `@navegsistemas/domain` vem do GitHub Packages, e o `.npmrc` lê o token de `NPM_TOKEN`. Aqui ele é o
# `GITHUB_TOKEN` do próprio job, que expira sozinho — para isso o pacote precisa conceder leitura a este
# repositório (no GitHub, o pacote → *Package settings* → *Manage Actions access*).
#
# O cenário contra o emulador ainda fica pulado: ele precisa do `fluviapp-kmp` ao lado, que o CI só clona
# quando existir o token da org (fase 0b).
name: verificar

on:
  pull_request:
  push:
    branches: [main, producao]

permissions:
  contents: read
  packages: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # typecheck e os cenários
      - run: npm run verify

  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Só as dependências que vão ao ar, e só de alta gravidade para cima: as moderadas entram pelo Dependabot.
      - run: npm audit --omit=dev --audit-level=high
