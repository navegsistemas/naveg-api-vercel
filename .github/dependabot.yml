# Atualizações semanais, agrupadas: um PR por ecossistema, e não um por pacote. Cada PR passa pelos mesmos
# checks de qualquer outro (`verificar.yml`) e pela fumaça no preview.
#
# O `@navegsistemas/domain` fica de fora: ele muda por decisão, junto com o `naveg-front`, e não por agenda.
version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_NPM_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@navegsistemas/domain'
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
